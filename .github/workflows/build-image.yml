name: Docker Image Builder
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Select image to build'
        required: true
        default: 'stream8'
        type: choice
        options:
        - centos7
        - fedora39
        - fedora39-rpmbuild
        - stream8
        - stream8-devel
        - stream8-rpmbuild
        - stream9
        - ubi8
        - ubi8-rpmbuild
        - ubuntu
        - ubuntu-awscli
        - ubuntu-hadolint
permissions:
  id-token: write
  packages: write
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Initiating process
        run: |
          echo "Building image for ${{ github.event.inputs.image }}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: latest
      - name: Docker login to ghcr.io
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ github.event.inputs.image }}
          push: true
          platforms: "linux/amd64"
          tags: ghcr.io/platformfuzz/image-builder/${{ github.event.inputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
